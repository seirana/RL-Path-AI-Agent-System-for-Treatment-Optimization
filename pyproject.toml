[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-path"
version = "0.2.0"
description = "Reproducible reinforcement-learning research simulator for pathway steering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7,<4",
  "mygene>=3.2,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "torch>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
rlpath-train = "train:main"
rlpath-evaluate = "evaluate:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["train", "evaluate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "artifacts",
  "data",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]
