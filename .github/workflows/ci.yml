name: CI

on:
  push:
    branches: [main, quality-upgrade]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1,<3"
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts train.py evaluate.py

      - name: Run tests
        run: python -m pytest

      - name: Check command-line entry points
        run: |
          rlpath-train --help
          rlpath-evaluate --help
          rlpath-seed-sweep --help
          rlpath-psc-pathways --help
          python -c "import scripts.PSC_rollout"

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build research container
        run: docker build -t rl-path-ci .
